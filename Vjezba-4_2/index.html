<!DOCTYPE html>
<html>
    <head>
        <title>Vježba 4_2</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <meta charset="UTF-8">
    </head>
    <body>
        <form action="" method="post">
            <label for="firstname">First name *</label><br>
            <input type="text" id="firstname" name="firstname" placeholder="Your first name.." required><br>
            <label for="lastname">Last name *</label><br>
            <input type="text" id="lastname" name="lastname" placeholder="Your last name.." required><br>
            <label for="email">Your E-mail *</label><br>
            <input type="email" id="firstname" name="email" placeholder="Your E-mail.." required><br>
            <label for="Country">Country</label><br>
            <select id="country" name="country">
                <option Value="">Please select</option>
                <option Value="BE">Belgium</option>
                <option Value="HR" selected>Croatia</option>
                <option Value="LU">Luxemburg</option>
                <option Value="HU">Hungary</option>
            </select><br>
            <label for="message">Message</label><br>
            <textarea class="form-control" id="message" name="message" placeholder="Write something"></textarea><br>
            <input type="submit" value="Send">
            <input type="reset" value="Reset"><br>
        </form>
    </body>
